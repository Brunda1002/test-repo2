name: Grouper ALB POC — Terraform

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      stage:
        description: "Which stage to run (stage1 or stage2)"
        required: true
        default: "stage2"
        type: choice
        options:
          - stage1
          - stage2

permissions:
  contents: read
  pull-requests: write

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:

  azure_infra:
    name: "Stage 1 — Azure Infra"
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.stage == 'stage1')

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan — Azure infra
        run: |
          terraform plan \
            -var-file="terraform.tfvars" \
            -target=azurerm_subnet.alb \
            -target=azurerm_user_assigned_identity.alb \
            -target=azurerm_federated_identity_credential.alb \
            -target=azapi_resource.alb \
            -target=azapi_resource.alb_association \
            -out=tfplan-infra \
            -input=false

      - name: Terraform Apply — Azure infra
        run: terraform apply -auto-approve -input=false tfplan-infra

  app_deploy:
    name: "Stage 2 — Helm + App"
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' && github.event.inputs.stage == 'stage2'

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan — Helm + App
        run: |
          terraform plan \
            -var-file="terraform.tfvars" \
            -target=helm_release.alb_controller \
            -target=kubernetes_namespace.app \
            -target=kubernetes_deployment.nginx \
            -target=kubernetes_service.nginx \
            -target=kubernetes_manifest.gateway \
            -target=kubernetes_manifest.httproute \
            -out=tfplan-app \
            -input=false

      - name: Terraform Apply — Helm + App
        run: terraform apply -auto-approve -input=false tfplan-app
